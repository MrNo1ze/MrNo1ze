<svg width="660" height="364" viewBox="0 0 660 364" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Агрегированная статистика приватных репозиториев">
  <defs>
    <linearGradient id="panelGlow" x1="0" y1="0" x2="660" y2="364" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1f2030"/>
      <stop offset="1" stop-color="#171823"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#bb9af7"/>
      <stop offset="1" stop-color="#ff4fd8"/>
    </linearGradient>
    <clipPath id="barClip"><rect x="26" y="252" width="608" height="16" rx="8"/></clipPath>
  </defs>

  <style>
    .mono  { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
    .title { fill: #c0caf5; font-size: 26px; font-weight: 700; letter-spacing: 1.4px; }
    .lead  { fill: #c0caf5; font-size: 44px; font-weight: 750; }
    .label { fill: #a9b1d6; font-size: 16px; }
    .muted { fill: #8389a3; font-size: 13.5px; }
    .stamp { fill: #6b7089; font-size: 12.5px; }
    .pct   { fill: #c0caf5; font-size: 15px; font-weight: 700; }
    .leg   { fill: #a9b1d6; font-size: 15px; }
  </style>

  <rect x="1" y="1" width="658" height="362" rx="20" fill="url(#panelGlow)" stroke="#32364f" stroke-width="2"/>
  <rect x="26" y="16" width="72" height="4" rx="2" fill="url(#accent)"/>

  <text x="26" y="48" class="mono title">ПРИВАТНАЯ АКТИВНОСТЬ</text>
  <text x="634" y="48" class="mono stamp" text-anchor="end">обновлено 03.09.2026</text>
  <text x="26" y="74" class="mono muted" style="font-size:14px">сводка без раскрытия названий и деталей репозиториев</text>

  <rect x="26" y="92" width="296" height="116" rx="16" fill="#1b1c28" stroke="#2b3048"/>
  <text x="44" y="144" class="mono lead">11</text>
  <text x="44" y="174" class="mono label">приватных репозиториев</text>
  <text x="44" y="195" class="mono muted">7 активных · 4 в архиве</text>

  <rect x="338" y="92" width="296" height="116" rx="16" fill="#1b1c28" stroke="#2b3048"/>
  <text x="356" y="144" class="mono lead">15.9 MB</text>
  <text x="356" y="174" class="mono label">кода распознано по языкам</text>
  <text x="356" y="195" class="mono muted">только приватные репозитории</text>

  <text x="26" y="238" class="mono label">распределение по языкам</text>

  <g clip-path="url(#barClip)">
    <rect x="26.0" y="252" width="608.0" height="16" fill="#7dcfff"/>
    <rect x="259.5" y="252" width="374.5" height="16" fill="#a9b1d6"/>
    <rect x="418.8" y="252" width="215.2" height="16" fill="#7aa2f7"/>
    <rect x="493.6" y="252" width="140.4" height="16" fill="#e0af68"/>
    <rect x="534.9" y="252" width="99.1" height="16" fill="#ff9e64"/>
    <rect x="572.0" y="252" width="62.0" height="16" fill="#9ece6a"/>
  </g>

  <g transform="translate(26 302)">
    <circle cx="5" cy="-5" r="5" fill="#7dcfff"/>
    <text x="20" y="0" class="mono leg">Go</text>
    <text x="188" y="0" class="mono pct" text-anchor="end">38.4%</text>
  </g>
  <g transform="translate(229 302)">
    <circle cx="5" cy="-5" r="5" fill="#a9b1d6"/>
    <text x="20" y="0" class="mono leg">C</text>
    <text x="188" y="0" class="mono pct" text-anchor="end">26.2%</text>
  </g>
  <g transform="translate(432 302)">
    <circle cx="5" cy="-5" r="5" fill="#7aa2f7"/>
    <text x="20" y="0" class="mono leg">TypeScript</text>
    <text x="188" y="0" class="mono pct" text-anchor="end">12.3%</text>
  </g>
  <g transform="translate(26 336)">
    <circle cx="5" cy="-5" r="5" fill="#e0af68"/>
    <text x="20" y="0" class="mono leg">JavaScript</text>
    <text x="188" y="0" class="mono pct" text-anchor="end">6.8%</text>
  </g>
  <g transform="translate(229 336)">
    <circle cx="5" cy="-5" r="5" fill="#ff9e64"/>
    <text x="20" y="0" class="mono leg">HTML</text>
    <text x="188" y="0" class="mono pct" text-anchor="end">6.1%</text>
  </g>
  <g transform="translate(432 336)">
    <circle cx="5" cy="-5" r="5" fill="#9ece6a"/>
    <text x="20" y="0" class="mono leg">прочее</text>
    <text x="188" y="0" class="mono pct" text-anchor="end">10.2%</text>
  </g>
