name: Contribution Snake

on:
  workflow_dispatch:
  schedule:
    - cron: "23 2 * * *"
  push:
    branches:
      - main
    paths:
      - README.md

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # Шкала должна монотонно расти по яркости и начинаться заметно выше
          # цвета пустой клетки: две трети активных дней — это уровень 1, и на
          # прежней палитре он давал контраст 1.37:1, то есть был не виден.
          # Верх шкалы держим непохожим на розовую змейку, чтобы не сливались.
          outputs: |
            assets/github-snake.svg?palette=github-light&color_snake=#ff4fd8&color_dots=#ebedf0,#7dcfff,#33a8e0,#6d5cd6,#3b2a8c
            assets/github-snake-dark.svg?palette=github-dark&color_snake=#ff4fd8&color_dots=#16161e,#2b5f7a,#3f9fc4,#22d3ee,#a8f0ff

      - name: Commit generated snake
        shell: bash
        run: |
          # Platane/snk скрейпит граф активности без токена и иногда получает
          # пустой/частичный ответ — тогда змейка вырождается в одну точку.
          # Такой результат не коммитим: остаётся прошлый SVG, следующий cron перегенерит.
          cells() { { grep -o 'class="c c' "$1" || true; } | wc -l | tr -d ' '; }

          new=$(cells assets/github-snake-dark.svg)
          prev=$(git show HEAD:assets/github-snake-dark.svg 2>/dev/null | { grep -o 'class="c c' || true; } | wc -l | tr -d ' ')
          echo "Активных клеток: было $prev, стало $new"

          if [ "$prev" -gt 0 ] && [ "$((new * 2))" -lt "$prev" ]; then
            echo "::warning::Граф активности отдался пустым ($new клеток против $prev) — оставляем предыдущую змейку"
            git checkout -- assets/github-snake.svg assets/github-snake-dark.svg
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-snake.svg assets/github-snake-dark.svg

          if git diff --cached --quiet; then
            echo "Snake is already up to date."
            exit 0
          fi

          git commit -m "chore: refresh contribution snake"
          git push
