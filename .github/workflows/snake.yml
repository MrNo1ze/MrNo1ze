name: Contribution Snake

on:
  workflow_dispatch:
  schedule:
    - cron: "23 2 * * *"
  push:
    branches:
      - main
    paths:
      - README.md

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/github-snake.svg?palette=github-light&color_snake=#ff4fd8&color_dots=#ebedf0,#b4efff,#7dcfff,#bb9af7,#ff4fd8
            assets/github-snake-dark.svg?palette=github-dark&color_snake=#ff4fd8&color_dots=#16161e,#22304f,#315b9d,#22d3ee,#bb9af7

      - name: Commit generated snake
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-snake.svg assets/github-snake-dark.svg

          if git diff --cached --quiet; then
            echo "Snake is already up to date."
            exit 0
          fi

          git commit -m "chore: refresh contribution snake"
          git push
