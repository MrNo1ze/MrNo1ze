name: Private stats

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
  push:
    branches: [main]
    paths:
      - scripts/build_private_stats.py
      - scripts/test_build_private_stats.py
      - .github/workflows/private-stats.yml
  pull_request:
    paths:
      - scripts/build_private_stats.py
      - scripts/test_build_private_stats.py
      - .github/workflows/private-stats.yml

permissions:
  contents: read

concurrency:
  group: private-stats
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check collector and renderer
        run: python3 scripts/build_private_stats.py --self-check

  build:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      # STATS_TOKEN — личный токен: fine-grained с Metadata: Read-only на все
      # репозитории либо классический со scope `repo`. Встроенный GITHUB_TOKEN
      # видит лишь текущий репозиторий и остальные приватные не перечислит.
      - name: Build stats card
        env:
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          if [ -z "$STATS_TOKEN" ]; then
            echo "::error::Секрет STATS_TOKEN не задан — карточка не обновлена"
            exit 1
          fi
          python3 scripts/build_private_stats.py

      - name: Commit stats card
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/private-stats.svg assets/private-stats.json README.md

          if git diff --cached --quiet; then
            echo "Статистика не изменилась."
            exit 0
          fi

          git commit -m "chore: refresh private stats"
          # Snake тоже пишет в main; сохраняем его коммит при одновременном запуске.
          git pull --rebase origin "$DEFAULT_BRANCH"
          git push origin "HEAD:$DEFAULT_BRANCH"
          echo "Опубликованы SVG, JSON и новая версия ссылки в README." >> "$GITHUB_STEP_SUMMARY"
